[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-bulk-fill"
version = "0.1.0"
description = "Excel-driven bulk PDF filler supporting AcroForm comb fields, checkboxes, ID card images, and text overlays."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.0",
    "msoffcrypto-tool>=5.4.0",
    "Pillow>=10.0.0",
    "num2words>=0.5.13",
    "Babel>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
pdf-bulk-fill = "pdf_bulk_fill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pdf_bulk_fill --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/pdf_bulk_fill"]
branch = true
